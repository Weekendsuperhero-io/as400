[package]
name = "carddemo-modern"
version = "1.0.0"
edition = "2021"
description = "Modernized AWS CardDemo Mainframe Banking Core (VSAM + CICS + BMS 3270 + DB2 + IMS + JCL Batch) in Safe Rust"

[dependencies]
axum = "0.8"
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.41", features = ["bundled"] }
rust_decimal = "1.36"
chrono = { version = "0.4", features = ["serde"] }
typeshare = "1.0"
ts-rs = "12.0"
utoipa = "5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
