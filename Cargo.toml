[package]
name = "carddemo-modern"
version = "1.0.0"
edition = "2021"
description = "Modernized AWS CardDemo Mainframe Banking Core (VSAM + CICS + BMS 3270 + DB2 + IMS + JCL Batch) in Safe Rust"

[dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = "1.36"
chrono = { version = "0.4", features = ["serde"] }
